[project]
name = "fleet-common"
version = "0.1.0"
description = "Shared domain logic, event contract, config and adapters (CLAUDE.md S7)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",         # event contract + validation, single source of truth
    "pydantic-settings>=2.7",  # config via environment only (CLAUDE.md S7)
    "orjson>=3.10",            # fast JSON in the hot path (CLAUDE.md S9)
    "structlog>=24.4",         # structured JSON logs with correlation ids
    "pyjwt[crypto]>=2.10",     # OIDC/JWT validation, JWKS (D4)
    "httpx>=0.28",             # async JWKS fetch with timeouts
    "prometheus-client>=0.21",  # events/s, lag, latency histograms
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleet_common"]
