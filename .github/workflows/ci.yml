# CI pipeline.
#
# Every `uses:` is pinned to a COMMIT SHA, with the version kept as a trailing comment.
# A tag like @v4 is mutable - the action's owner can repoint it, so the code running with
# this repository's credentials can change with nothing in any diff to show it. That is
# STRIDE E6, CI supply-chain compromise, and Semgrep's
# github-actions-mutable-action-tag flagged all 12 references.
#
# Caught only after docker-compose images had already been pinned to digests for exactly
# the same reason: the lesson was applied to one file and not the other.
#
# To update an action: change the SHA and the comment together. `gh api
# repos/<owner>/<repo>/commits/<tag>` resolves one.
# ---------------------------------------------------------------------------
# CI on every push (hackathon PDF S12: "All suites should run automatically in
# CI on every push"). Fails on lint, type or coverage regressions.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a toolchain update cannot silently change results (CLAUDE.md S9:
  # every measurement records its configuration).
  UV_VERSION: "0.12.4"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the pinned workspace
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict on libs and domain)
        run: uv run mypy

      # A tag is mutable, so "the image we tested" and "the image that runs" can diverge
      # without any diff showing it (CLAUDE.md S11). --check writes nothing and fails if any
      # reference is tag-only.
      - name: Container images pinned by digest
        run: uv run python -m tests.tools.pin_digests docker-compose.yml --check

      - name: Unit tests with coverage gate
        # Gate scope is libs + domain + application (ruling G7); adapters are
        # measured but report-only so the gate cannot be gamed.
        run: |
          mkdir -p docs/evidence/coverage
          uv run pytest -m "not integration" \
            --cov --cov-report=term-missing \
            --cov-report=xml:docs/evidence/coverage/coverage.xml \
            --cov-fail-under=80

      # Runs beside the unit tests rather than in its own job: the scenarios drive the
      # real app over a fake data layer, so they need no infrastructure and finish in
      # well under a second.
      - name: BDD acceptance scenarios
        run: uv run behave --no-capture --junit --junit-directory docs/evidence/acceptance

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ github.sha }}
          path: docs/evidence/coverage/
          if-no-files-found: warn

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: acceptance-${{ github.sha }}
          path: docs/evidence/acceptance/
          if-no-files-found: warn

  contract:
    name: Event contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages --frozen

      # Runs on its own so a contract break is unmistakable in the run summary:
      # it means producer and consumer no longer agree on the wire format.
      - name: Schema contract tests
        run: uv run pytest libs/fleet_common/tests/test_contract_schema.py -v

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # continue-on-error is gone deliberately. It made a SAST finding indistinguishable
      # from a clean scan for anyone reading the run summary - the same false green the
      # `|| true` on the scan commands used to produce. The ruleset now matches what
      # `make security` runs locally, so a developer and CI cannot disagree about whether
      # the tree is clean.
      #
      # This scan currently passes with 0 findings, after it caught all 12 `uses:`
      # references pointing at mutable action tags - which is STRIDE E6 and is why every
      # one of them is now a commit SHA.
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/python
            p/secrets
            p/owasp-top-ten

      - name: Trivy filesystem and secret scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: security-scans-${{ github.sha }}
          path: "*.sarif"
          if-no-files-found: warn

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # ubuntu runners ship a Docker daemon, so Testcontainers works unchanged.
      - name: Integration tests against real infrastructure
        run: uv run pytest -m integration -v
