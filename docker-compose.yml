# ---------------------------------------------------------------------------
# One-command local stack. Hackathon deliverable S13: "one-command local setup".
# Profiles (CLAUDE.md S6):
#   core  - brokers + datastores + app services (default for `make up`)
#   obs   - Prometheus + Grafana
#   load  - load generator
#
# Image pinning: CLAUDE.md S11 requires pinned digests and no `latest` tags.
# Exact minor tags are used here; digests are resolved by `make pin-digests`
# once a Docker daemon is available (tracked in docs/PROGRESS.md).
# ---------------------------------------------------------------------------

name: fleet-intel

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # --- Kafka, KRaft mode (no ZooKeeper). CLAUDE.md S4. --------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: fleet-kafka
    profiles: [core]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker locally; RF=3 in cloud (ADR-0004).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 96
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: fleet-intel-local-cluster
      # The local Docker VM has ~3.9 GB total for four datastores, so the broker
      # is capped well below its default heap. Cloud values live in Helm values,
      # not here (CLAUDE.md S13).
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      <<: *hc
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- Topic creation (ADR-0004) ------------------------------------------
  # Runs as an init container rather than a host script so `up` needs no Kafka
  # client on the developer machine. On this Windows host the confluent-kafka
  # native library is blocked by Application Control (blocker B2), and CI should
  # not depend on host tooling either. Idempotent: --if-not-exists, so re-running
  # `up` is safe.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: fleet-kafka-init
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:19092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT"             --create --if-not-exists --topic "$$1"             --partitions "$$2" --replication-factor 1             --config retention.ms="$$3" $${4:-}
        }
        # Partition counts from ADR-0004 (amended). telemetry.raw uses 96: the
        # measured 4,404 events/s per consumer means ~23 consumers for the 100K
        # events/s NFR, and partitions are a hard ceiling on consumer parallelism.
        # 96 leaves 4.2x headroom and divides by 2/3/4/6/8/12/16/24/32/48.
        # Chosen now because Kafka cannot shrink a topic, and growing one rewrites
        # every key's partition mapping - which would split a vehicle's in-flight
        # idle state across two consumers.
        create telemetry.raw   96 86400000
        create telemetry.dlq    6 604800000   # kept 7 days: these need triage
        create telemetry.late   6 604800000   # reconciled by the batch job
        create idle.events     12 604800000
        create alerts           6 604800000
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --list

  # --- PostgreSQL: relational core, 3NF + rollups (CLAUDE.md S8) ----------
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    profiles: [core]
    ports:
      # Published on 55432 by default, not 5432. A locally installed PostgreSQL
      # service commonly already owns 5432, and on Windows the published port can
      # still bind while connections silently reach the native server instead -
      # which looks exactly like a wrong password. The container port is unchanged,
      # so service-to-service connections inside the compose network still use 5432.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so ORDER BY is stable across machines (keyset pagination).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet}"]
      <<: *hc
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # --- MongoDB: raw/enriched telemetry, TTL hot tier (CLAUDE.md S8) -------
  mongo:
    image: mongo:7.0
    container_name: fleet-mongo
    profiles: [core]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      <<: *hc
    volumes:
      - mongo-data:/data/db

  # --- Redis 7.2.x: hot state, dedup window, cache -----------------------
  # Pinned to 7.2 deliberately (ADR-0002 / CLAUDE.md S4): 7.4 changed licence.
  # Do NOT bump this tag without an ADR.
  redis:
    image: redis:7.2-alpine
    container_name: fleet-redis
    profiles: [core]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      <<: *hc
    volumes:
      - redis-data:/data

volumes:
  kafka-data:
  postgres-data:
  mongo-data:
  redis-data:
