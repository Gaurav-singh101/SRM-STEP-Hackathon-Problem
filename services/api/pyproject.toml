[project]
name = "fleet-api"
version = "0.1.0"
description = "FastAPI read API, hexagonal: domain / application / adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleet-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "psycopg-pool>=3.2",
    "pymongo>=4.10",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.uv.sources]
fleet-common = { workspace = true }
