[project]
name = "fleet-simulator"
version = "0.1.0"
description = "Synthetic 100K+ vehicle telemetry generator; part of the solution (PDF S8)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleet-common",
    "numpy>=2.2",              # vectorised generation so the simulator is not the bottleneck
    "confluent-kafka>=2.6",    # librdkafka producer (ADR-0005 / D5)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.uv.sources]
fleet-common = { workspace = true }
