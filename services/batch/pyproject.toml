[project]
name = "fleet-batch"
version = "0.1.0"
description = "Historical rollups, late-event reconciliation, retention jobs (ADR-0006 / D6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleet-common",
    # The seed job writes the SAME roster the simulator emits telemetry for. Sharing
    # the generator rather than reimplementing it is the point: a VIN missing from the
    # vehicles table has no powertrain, and a vehicle with no powertrain has no cost.
    "fleet-simulator",
    "psycopg[binary,pool]>=3.2",
    "pymongo>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["batch"]

[tool.uv.sources]
fleet-common = { workspace = true }
fleet-simulator = { workspace = true }
