[project]
name = "fleet-oidc-stub"
version = "0.1.0"
description = "Local OIDC provider for development and tests (D4). Never for production."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleet-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",  # form parsing for the token endpoint
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oidc_stub"]

[tool.uv.sources]
fleet-common = { workspace = true }
