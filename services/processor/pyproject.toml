[project]
name = "fleet-processor"
version = "0.1.0"
description = "Stream processing: validation, dedup, idle detection, aggregation (ADR-0005)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleet-common",
    "confluent-kafka>=2.6",
    "psycopg[binary,pool]>=3.2",  # batched COPY/executemany writes (CLAUDE.md S9)
    "pymongo>=4.10",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["processor"]

[tool.uv.sources]
fleet-common = { workspace = true }
