# behave's own config. Separate from pyproject.toml because behave 1.2.6 does not read
# it, and pointing at the features directory here means `behave` works with no arguments
# and `make test-acceptance` cannot drift from the layout.
[behave]
paths = tests/acceptance/features
show_timings = true
# Any step without a definition is a failure. The default is to report it and carry on,
# which would let a scenario claim to pass while asserting nothing.
strict = true
