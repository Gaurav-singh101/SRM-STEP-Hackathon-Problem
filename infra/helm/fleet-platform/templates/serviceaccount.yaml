{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fleet.serviceAccountName" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
# No token is mounted: nothing in this platform talks to the Kubernetes API, so a mounted
# token would be a credential available to an attacker for no operational benefit.
automountServiceAccountToken: false
{{- end }}
